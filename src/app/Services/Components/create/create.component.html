<div class="clay-dialog clay-dialog-shell" dir="rtl" style="width: 760px; max-width: 100%; box-sizing: border-box;">
  <!-- رأس النافذة المنبثقة (Header) -->
  <div class="clay-dialog-header">
    <div class="header-title-group">
      <div class="dialog-header-icon">
        <mat-icon>add_business</mat-icon>
      </div>
      <div>
        <h2 class="dialog-title">إضافة خدمة جديدة</h2>
        <p class="dialog-subtitle">أدخل تفاصيل وبيانات الخدمة، الموقع، ومواعيد العمل</p>
      </div>
    </div>
    <button type="button" class="btn-close" (click)="close()" aria-label="إغلاق">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- نموذج البيانات (Form Body) -->
  <form [formGroup]="form" (ngSubmit)="save()">
    <div class="clay-dialog-body">

      <!-- القسم 1: المعلومات الأساسية والتصنيف -->
      <div class="section-title">المعلومات الأساسية</div>

      <div class="form-row-grid">
        <div class="field-group">
          <label for="service-name-ar">اسم الخدمة (AR)</label>
          <input 
            id="service-name-ar"
            type="text" 
            class="clay-input-field" 
            formControlName="nameAr" 
            placeholder="اسم الخدمة بالعربية..." />
        </div>

        <div class="field-group">
          <label for="service-name-en">Service Name (EN)</label>
          <input 
            id="service-name-en"
            type="text" 
            class="clay-input-field" 
            formControlName="name" 
            dir="ltr"
            placeholder="Service name in English..." />
        </div>
      </div>

      <div class="form-row-grid">
        <div class="field-group">
          <label for="service-type-ar">النوع (AR)</label>
          <input 
            id="service-type-ar"
            type="text" 
            class="clay-input-field" 
            formControlName="typeAr" 
            placeholder="مثال: مطعم، فندق، مشفى..." />
        </div>

        <div class="field-group">
          <label for="service-type-en">Type (EN)</label>
          <input 
            id="service-type-en"
            type="text" 
            class="clay-input-field" 
            formControlName="type" 
            dir="ltr"
            placeholder="e.g. Restaurant, Hotel, Hospital..." />
        </div>
      </div>

      <div class="form-row-grid">
        <div class="field-group">
          <label for="service-specialty-ar">التخصص (AR)</label>
          <input 
            id="service-specialty-ar"
            type="text" 
            class="clay-input-field" 
            formControlName="specialtyAr" 
            placeholder="التخصص بالعربية..." />
        </div>

        <div class="field-group">
          <label for="service-specialty">Specialty (EN)</label>
          <input 
            id="service-specialty"
            type="text" 
            class="clay-input-field" 
            formControlName="specialty" 
            dir="ltr"
            placeholder="Specialty in English..." />
        </div>
      </div>

      <!-- الوصف -->
      <div class="form-row-grid">
        <div class="field-group">
          <label for="service-description-ar">الوصف (AR)</label>
          <textarea 
            id="service-description-ar"
            class="clay-input-field textarea-field" 
            rows="3" 
            formControlName="descriptionAr" 
            placeholder="وصف تفصيلي للخدمة..."></textarea>
        </div>

        <div class="field-group">
          <label for="service-description-en">Description (EN)</label>
          <textarea 
            id="service-description-en"
            class="clay-input-field textarea-field" 
            rows="3" 
            formControlName="description" 
            dir="ltr"
            placeholder="Detailed description in English..."></textarea>
        </div>
      </div>

      <!-- المزايا -->
      <div class="form-row-grid">
        <div class="field-group">
          <label for="service-features-ar">المزايا (AR)</label>
          <input 
            id="service-features-ar"
            type="text" 
            class="clay-input-field" 
            formControlName="featuresAr" 
            placeholder="ميزة 1, ميزة 2, ميزة 3" />
        </div>

        <div class="field-group">
          <label for="service-features">Features (EN)</label>
          <input 
            id="service-features"
            type="text" 
            class="clay-input-field" 
            formControlName="features" 
            dir="ltr"
            placeholder="Feature 1, Feature 2, Feature 3" />
        </div>
      </div>

      <!-- القسم 2: الاتصال والموقع والتقييم -->
      <div class="section-title" style="margin-top: 1rem;">بيانات الاتصال والموقع الجغرافي</div>

      <div class="form-row-grid">
        <div class="field-group">
          <label for="service-phone">رقم الهاتف</label>
          <input 
            id="service-phone"
            type="text" 
            class="clay-input-field" 
            formControlName="phone" 
            dir="ltr"
            placeholder="+20 100 000 0000" />
        </div>

        <div class="field-group">
          <label for="service-email">البريد الإلكتروني</label>
          <input 
            id="service-email"
            type="email" 
            class="clay-input-field" 
            formControlName="email" 
            dir="ltr"
            placeholder="service@example.com" />
        </div>
      </div>

      <div class="form-row-grid">
        <div class="field-group">
          <label for="service-address-ar">العنوان (AR)</label>
          <input 
            id="service-address-ar"
            type="text" 
            class="clay-input-field" 
            formControlName="addressAr" 
            placeholder="العنوان بالعربية بالتفصيل..." />
        </div>

        <div class="field-group">
          <label for="service-address-en">Address (EN)</label>
          <input 
            id="service-address-en"
            type="text" 
            class="clay-input-field" 
            formControlName="address" 
            dir="ltr"
            placeholder="Full address in English..." />
        </div>
      </div>

      <div class="form-three-grid">
        <div class="field-group">
          <label for="service-latitude">خط العرض (Latitude)</label>
          <input 
            id="service-latitude"
            type="number" 
            step="any"
            class="clay-input-field" 
            formControlName="latitude" 
            dir="ltr"
            placeholder="28.1099" />
        </div>

        <div class="field-group">
          <label for="service-longitude">خط الطول (Longitude)</label>
          <input 
            id="service-longitude"
            type="number" 
            step="any"
            class="clay-input-field" 
            formControlName="longitude" 
            dir="ltr"
            placeholder="30.7503" />
        </div>

        <div class="field-group">
          <label for="service-distance">المسافة (كم)</label>
          <input 
            id="service-distance"
            type="number" 
            step="0.1"
            class="clay-input-field" 
            formControlName="distanceKm" 
            placeholder="2.5" />
        </div>
      </div>

      <div class="form-row-grid">
        <div class="field-group">
          <label for="service-rating">التقييم (من 0 إلى 5)</label>
          <input 
            id="service-rating"
            type="number" 
            min="0" 
            max="5" 
            step="0.1"
            class="clay-input-field" 
            formControlName="rating" 
            placeholder="4.5" />
        </div>

        <div class="field-group">
          <label for="service-comments">عدد التعليقات</label>
          <input 
            id="service-comments"
            type="number" 
            min="0"
            class="clay-input-field" 
            formControlName="commentsCount" 
            placeholder="0" />
        </div>
      </div>

      <!-- الصورة ورابطها -->
      <div class="form-row-grid" style="align-items: center;">
        <div class="field-group">
          <label for="service-image">رابط الصورة</label>
          <input 
            id="service-image"
            type="text" 
            class="clay-input-field" 
            formControlName="image" 
            dir="ltr"
            placeholder="https://example.com/image.jpg" />
        </div>

        <div class="field-group" style="padding-top: 0.8rem;">
          <label class="btn-upload-label" for="service-image-file">
            <mat-icon>cloud_upload</mat-icon>
            <span>رفع ملف الصورة</span>
          </label>
          <input 
            id="service-image-file" 
            type="file" 
            accept="image/*" 
            (change)="onFileChange($event)" 
            style="display: none;" />
        </div>
      </div>

      <!-- القسم 3: خيارات الخدمة الإضافية (Checkboxes) -->
      <div class="section-title" style="margin-top: 1rem;">المميزات والخدمات السريعة</div>
      
      <div style="display: flex; flex-wrap: wrap; gap: 1.25rem; margin-bottom: 1.25rem; padding: 0.5rem 0;">
        <mat-checkbox formControlName="is24h" color="primary">خدمة 24 ساعة</mat-checkbox>
        <mat-checkbox formControlName="isEmergency" color="primary">طوارئ</mat-checkbox>
        <mat-checkbox formControlName="isFeatured" color="primary">خدمة مميزة</mat-checkbox>
        <mat-checkbox formControlName="hasDelivery" color="primary">خدمة التوصيل</mat-checkbox>
        <mat-checkbox formControlName="acceptsInsurance" color="primary">يقبل التأمين</mat-checkbox>
      </div>

      <!-- القسم 4: جدول ساعات العمل الأسبوعية -->
      <div class="section-title" style="margin-top: 1rem;">ساعات العمل طوال الأسبوع</div>

      <!-- السبت -->
      <div class="form-row-grid">
        <div class="field-group">
          <label for="service-opening-sat-ar">السبت (AR)</label>
          <input 
            id="service-opening-sat-ar"
            type="text" 
            class="clay-input-field" 
            formControlName="openingHoursArSaturday" 
            placeholder="مثال: 9:00 ص - 10:00 م" />
        </div>
        <div class="field-group">
          <label for="service-opening-sat-en">Saturday (EN)</label>
          <input 
            id="service-opening-sat-en"
            type="text" 
            class="clay-input-field" 
            formControlName="openingHoursEnSaturday" 
            dir="ltr"
            placeholder="e.g. 9:00 AM - 10:00 PM" />
        </div>
      </div>

      <!-- الأحد -->
      <div class="form-row-grid">
        <div class="field-group">
          <label for="service-opening-sun-ar">الأحد (AR)</label>
          <input 
            id="service-opening-sun-ar"
            type="text" 
            class="clay-input-field" 
            formControlName="openingHoursArSunday" 
            placeholder="مثال: 9:00 ص - 10:00 م" />
        </div>
        <div class="field-group">
          <label for="service-opening-sun-en">Sunday (EN)</label>
          <input 
            id="service-opening-sun-en"
            type="text" 
            class="clay-input-field" 
            formControlName="openingHoursEnSunday" 
            dir="ltr"
            placeholder="e.g. 9:00 AM - 10:00 PM" />
        </div>
      </div>

      <!-- الاثنين -->
      <div class="form-row-grid">
        <div class="field-group">
          <label for="service-opening-mon-ar">الاثنين (AR)</label>
          <input 
            id="service-opening-mon-ar"
            type="text" 
            class="clay-input-field" 
            formControlName="openingHoursArMonday" 
            placeholder="مثال: 9:00 ص - 10:00 م" />
        </div>
        <div class="field-group">
          <label for="service-opening-mon-en">Monday (EN)</label>
          <input 
            id="service-opening-mon-en"
            type="text" 
            class="clay-input-field" 
            formControlName="openingHoursEnMonday" 
            dir="ltr"
            placeholder="e.g. 9:00 AM - 10:00 PM" />
        </div>
      </div>

      <!-- الثلاثاء -->
      <div class="form-row-grid">
        <div class="field-group">
          <label for="service-opening-tue-ar">الثلاثاء (AR)</label>
          <input 
            id="service-opening-tue-ar"
            type="text" 
            class="clay-input-field" 
            formControlName="openingHoursArTuesday" 
            placeholder="مثال: 9:00 ص - 10:00 م" />
        </div>
        <div class="field-group">
          <label for="service-opening-tue-en">Tuesday (EN)</label>
          <input 
            id="service-opening-tue-en"
            type="text" 
            class="clay-input-field" 
            formControlName="openingHoursEnTuesday" 
            dir="ltr"
            placeholder="e.g. 9:00 AM - 10:00 PM" />
        </div>
      </div>

      <!-- الأربعاء -->
      <div class="form-row-grid">
        <div class="field-group">
          <label for="service-opening-wed-ar">الأربعاء (AR)</label>
          <input 
            id="service-opening-wed-ar"
            type="text" 
            class="clay-input-field" 
            formControlName="openingHoursArWednesday" 
            placeholder="مثال: 9:00 ص - 10:00 م" />
        </div>
        <div class="field-group">
          <label for="service-opening-wed-en">Wednesday (EN)</label>
          <input 
            id="service-opening-wed-en"
            type="text" 
            class="clay-input-field" 
            formControlName="openingHoursEnWednesday" 
            dir="ltr"
            placeholder="e.g. 9:00 AM - 10:00 PM" />
        </div>
      </div>

      <!-- الخميس -->
      <div class="form-row-grid">
        <div class="field-group">
          <label for="service-opening-thu-ar">الخميس (AR)</label>
          <input 
            id="service-opening-thu-ar"
            type="text" 
            class="clay-input-field" 
            formControlName="openingHoursArThursday" 
            placeholder="مثال: 9:00 ص - 10:00 م" />
        </div>
        <div class="field-group">
          <label for="service-opening-thu-en">Thursday (EN)</label>
          <input 
            id="service-opening-thu-en"
            type="text" 
            class="clay-input-field" 
            formControlName="openingHoursEnThursday" 
            dir="ltr"
            placeholder="e.g. 9:00 AM - 10:00 PM" />
        </div>
      </div>

      <!-- الجمعة -->
      <div class="form-row-grid">
        <div class="field-group">
          <label for="service-opening-fri-ar">الجمعة (AR)</label>
          <input 
            id="service-opening-fri-ar"
            type="text" 
            class="clay-input-field" 
            formControlName="openingHoursArFriday" 
            placeholder="مثال: عطلة أسبوعية أو 2:00 م - 11:00 م" />
        </div>
        <div class="field-group">
          <label for="service-opening-fri-en">Friday (EN)</label>
          <input 
            id="service-opening-fri-en"
            type="text" 
            class="clay-input-field" 
            formControlName="openingHoursEnFriday" 
            dir="ltr"
            placeholder="e.g. Closed or 2:00 PM - 11:00 PM" />
        </div>
      </div>

    </div>

    <!-- أزرار الإجراءات (Actions) -->
    <div class="clay-dialog-actions">
      <button type="submit" class="btn-dialog-confirm">
        <mat-icon>check</mat-icon>
        <span>حفظ الخدمة</span>
      </button>

      <button type="button" class="btn-dialog-cancel" (click)="close()">
        <span>إلغاء</span>
      </button>
    </div>
  </form>
</div>
