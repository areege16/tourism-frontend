<div class="clay-view-container" dir="rtl">
  <!-- كارت الجدول الرئيسي وحاوية البيانات -->
<section class="clay-card table-card">    <!-- رأس الجدول وشريط الأدوات -->
    <div class="table-header">
      <div class="title-wrap">
        <div>
          <span style="font-size: 0.75rem; font-weight: 700; color: var(--cta-salmon); display: block; margin-bottom: 0.2rem;">إدارة المحتوى</span>
          <h3>معلومات السياحة</h3>
        </div>
        <span class="results-count">(عرض {{ filteredItems.length }} عنصر)</span>
      </div>

      <!-- أدوات التحكم والبحث والإضافة -->
      <div style="display: flex; align-items: center; gap: 0.75rem;">
        <input
          type="text"
          class="clay-input-field"
          style="margin: 0; min-width: 250px;"
          placeholder="ابحث عن عنوان أو فئة..."
          [(ngModel)]="searchTerm"
          (ngModelChange)="applyFilter()"
        />

        <button type="button" class="clay-btn-primary" (click)="openCreate()">
          <mat-icon>add</mat-icon>
          <span>إضافة جديدة</span>
        </button>
      </div>
    </div>

    <!-- حاوية تمرير الجدول بتنسيق Claymorphism -->
    <div class="table-scroll-container">
      <table mat-table [dataSource]="filteredItems" class="clay-mat-table">
        
        <!-- رقم السجل (Index) -->
        <ng-container matColumnDef="index">
          <th mat-header-cell *matHeaderCellDef style="width: 50px;">#</th>
          <td mat-cell *matCellDef="let element; let i = index">
            <span class="idx-badge">{{ i + 1 }}</span>
          </td>
        </ng-container>

        <!-- العنوان -->
        <ng-container matColumnDef="title">
          <th mat-header-cell *matHeaderCellDef>العنوان</th>
          <td mat-cell *matCellDef="let element">
            <strong style="color: var(--text-main);">{{ getDisplayTitle(element) }}</strong>
          </td>
        </ng-container>

        <!-- المناخ / التصنيف -->
        <ng-container matColumnDef="category">
          <th mat-header-cell *matHeaderCellDef>المناخ</th>
          <td mat-cell *matCellDef="let element">
            <span class="value-badge">
              <mat-icon style="font-size: 1rem; width: 1rem; height: 1rem; color: var(--icon-active);">wb_sunny</mat-icon>
              {{ getDisplayClimate(element) || '—' }}
            </span>
          </td>
        </ng-container>

        <!-- تاريخ آخر تحديث -->
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>آخر تحديث</th>
          <td mat-cell *matCellDef="let element">
            <span class="value-badge" dir="ltr">
              {{ element.lastUpdated || '—' }}
            </span>
          </td>
        </ng-container>

        <!-- الإجراءات (Actions) -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef style="text-align: center; width: 120px;">الإجراءات</th>
          <td mat-cell *matCellDef="let element">
            <div class="action-buttons-group" style="justify-content: center;">
              <button 
                type="button" 
                class="action-icon-btn view" 
                matTooltip="عرض التفاصيل" 
                (click)="openDetails(element)">
                <mat-icon>visibility</mat-icon>
              </button>

              <button 
                type="button" 
                class="action-icon-btn edit" 
                matTooltip="تعديل" 
                (click)="openEdit(element)">
                <mat-icon>edit</mat-icon>
              </button>

              <button 
                type="button" 
                class="action-icon-btn delete" 
                matTooltip="حذف" 
                (click)="openDelete(element)">
                <mat-icon>delete</mat-icon>
              </button>
            </div>
          </td>
        </ng-container>

        <!-- صفوف الرأس والبيانات -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns" class="clay-table-row"></tr>

        <!-- حالة التحميل أو عدم وجود نتائج داخل الـ Table -->
        <tr class="mat-row state-row" *matNoDataRow>
          <td class="mat-cell" [attr.colspan]="displayedColumns.length">
            <div *ngIf="isLoading" class="loading-state">
              <mat-icon class="spin-icon">sync</mat-icon>
              <span>جارٍ تحميل البيانات...</span>
            </div>

            <div *ngIf="!isLoading" class="empty-state">
              <mat-icon>search_off</mat-icon>
              <span>لا توجد عناصر لعرضها</span>
            </div>
          </td>
        </tr>
      </table>
    </div>
  </section>
</div>
