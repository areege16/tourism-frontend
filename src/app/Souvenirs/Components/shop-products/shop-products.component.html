<div class="clay-dialog" dir="rtl">
  <div class="clay-dialog-header">
    <div class="header-title-group">
      <div class="dialog-header-icon peach">
        <mat-icon>inventory_2</mat-icon>
      </div>
      <div>
        <h2 class="dialog-title">منتجات المحل</h2>
        <p class="dialog-subtitle">{{ data.shopName }}</p>
      </div>
    </div>
    <button type="button" class="btn-close" (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="clay-dialog-body">
    <div class="products-toolbar">
      <span class="results-count">({{ products.length }} منتج)</span>
      <button type="button" class="clay-btn-primary add-btn" (click)="addProduct()">
        <mat-icon>add</mat-icon>
        <span>إضافة منتج جديد</span>
      </button>
    </div>

    <div *ngIf="isLoading" class="loading-state">
      <mat-icon class="spin-icon">hourglass_empty</mat-icon>
      <span>جاري تحميل المنتجات...</span>
    </div>

    <div *ngIf="!isLoading && !products.length" class="empty-state">
      <mat-icon>inventory</mat-icon>
      <span>لا توجد منتجات لهذا المحل</span>
    </div>

    <div class="products-grid" *ngIf="!isLoading && products.length">
      <div class="product-card" *ngFor="let p of products">
        <div class="product-image">
          <img
            *ngIf="p.image && !hasImageError(p.image); else noImage"
            [src]="getFullImageUrl(p.image)"
            (error)="onImageError(p.image)"
            [alt]="p.nameAr"
          />
          <ng-template #noImage>
            <div class="product-image-fallback">
              <mat-icon>image_not_supported</mat-icon>
            </div>
          </ng-template>
        </div>

        <div class="product-info">
          <strong class="product-name">{{ p.nameAr }}</strong>
          <span class="product-price" dir="ltr">{{ p.price | number: '1.0-2' }} {{ p.currency }}</span>

          <div class="product-tags">
            <span class="tag" [class.in-stock]="p.inStock" [class.out-stock]="!p.inStock">
              {{ p.inStock ? 'متوفر' : 'غير متوفر' }}
            </span>
            <span class="tag handmade" *ngIf="p.handmade">يدوي</span>
          </div>
        </div>

        <button
          type="button"
          class="action-icon-btn delete"
          matTooltip="حذف المنتج"
          (click)="openDelete(p)"
        >
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    </div>
  </div>

  <div class="clay-dialog-actions">
    <button type="button" class="btn-dialog-cancel" (click)="close()">إغلاق</button>
  </div>
</div>
