<div class="clay-dialog clay-dialog-shell" dir="rtl" style="width: 720px; max-width: 100%; box-sizing: border-box;">
  <!-- رأس النافذة المنبثقة (Header) -->
  <div class="clay-dialog-header">
    <div class="header-title-group">
      <div class="dialog-header-icon">
        <mat-icon>manage_accounts</mat-icon>
      </div>
      <div>
        <h2 class="dialog-title">تعديل المرشد السياحي</h2>
        <p class="dialog-subtitle">تحديث بيانات المرشد ووسائل التواصل والموقع</p>
      </div>
    </div>
    <button type="button" class="btn-close" (click)="close()" aria-label="إغلاق">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- نموذج البيانات (Form Body) -->
  <form [formGroup]="form" (ngSubmit)="save()">
    <div class="clay-dialog-body">

      <!-- القسم 1: المعلومات الشخصية -->
      <div class="section-title">المعلومات الشخصية والبيو</div>

      <div class="form-row-grid">
        <div class="field-group">
          <label>الاسم بالعربية</label>
          <input type="text" class="clay-input-field" formControlName="nameAr" placeholder="اسم المرشد بالعربية..." />
        </div>

        <div class="field-group">
          <label>Name in English</label>
          <input type="text" class="clay-input-field" formControlName="nameEn" dir="ltr"
            placeholder="Guide name in English..." />
        </div>
      </div>

      <div class="form-row-grid">
        <div class="field-group">
          <label>السيرة بالعربية</label>
          <textarea class="clay-input-field textarea-field" rows="3" formControlName="bioAr"
            placeholder="نبذة تعريفية عن المرشد..."></textarea>
        </div>

        <div class="field-group">
          <label>Bio in English</label>
          <textarea class="clay-input-field textarea-field" rows="3" formControlName="bioEn" dir="ltr"
            placeholder="Tour guide biography..."></textarea>
        </div>
      </div>

      <div class="form-row-grid">
        <div class="field-group">
          <label>اللغات</label>
          <input type="text" class="clay-input-field" formControlName="languages"
            placeholder="إنجليزي, عربي, فرنسي..." />
        </div>

        <div class="field-group">
          <label>التقييم (من 0 إلى 5)</label>
          <input type="number" step="0.1" min="0" max="5" class="clay-input-field" formControlName="rating"
            placeholder="4.8" />
        </div>
      </div>

      <!-- الصورة ورابطها -->
      <div class="field-group">
        <label>الصورة الشخصية</label>
        <input #fileInput type="file" class="clay-input-field" accept="image/*" (change)="onFileChange($event)" />

        <!-- خانة معاينة الصورة (سواء القديمة أو الجديدة المرفوعة) -->
        <div *ngIf="imagePreview" class="image-preview-container"
          style="margin-top: 10px; display: flex; align-items: center; gap: 12px;">
          <div
            style="position: relative; width: 80px; height: 80px; border-radius: 8px; overflow: hidden; border: 1px solid #ccc;">
            <img [src]="imagePreview" alt="معاينة الصورة" style="width: 100%; height: 100%; object-fit: cover;" />
          </div>
          <button type="button" class="btn-remove-image" (click)="removeImage(fileInput)"
            style="background: #ff4d4f; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 4px;">
            <mat-icon style="font-size: 18px; width: 18px; height: 18px;">delete</mat-icon>
            <span>إزالة الصورة</span>
          </button>
        </div>
      </div>

      <!-- القسم 2: بيانات الاتصال والعنوان -->
      <div class="section-title" style="margin-top: 1rem;">بيانات الاتصال والعنوان</div>

      <div class="form-row-grid">


        <div class="field-group">
          <label>Phone </label>
          <input type="text" class="clay-input-field" formControlName="phone" dir="ltr"
            placeholder="+20 100 000 0000" />
        </div>
      </div>

      <div class="form-row-grid">


        <div class="field-group">
          <label>Email </label>
          <input type="email" class="clay-input-field" formControlName="email" dir="ltr"
            placeholder="user@example.com" />
        </div>
      </div>


      <!-- القسم 4: وسائل التواصل الاجتماعي -->
      <div class="section-title" style="margin-top: 1rem;">حسابات التواصل الاجتماعي</div>

      <div class="form-three-grid">
        <div class="field-group">
          <label>Facebook</label>
          <input type="text" class="clay-input-field" formControlName="facebook" dir="ltr"
            placeholder="Facebook profile/page" />
        </div>

        <div class="field-group">
          <label>Instagram</label>
          <input type="text" class="clay-input-field" formControlName="instagram" dir="ltr"
            placeholder="Instagram profile" />
        </div>

        <div class="field-group">
          <label>Twitter (X)</label>
          <input type="text" class="clay-input-field" formControlName="twitter" dir="ltr"
            placeholder="Twitter handle" />
        </div>
      </div>

      <div class="form-row-grid">
        <div class="field-group">
          <label>TikTok</label>
          <input type="text" class="clay-input-field" formControlName="tiktok" dir="ltr"
            placeholder="TikTok username" />
        </div>

        <div class="field-group">
          <label>YouTube</label>
          <input type="text" class="clay-input-field" formControlName="youtube" dir="ltr"
            placeholder="YouTube channel" />
        </div>
      </div>

    </div>

    <!-- أزرار الإجراءات (Actions) -->
    <div class="clay-dialog-actions">
      <button type="submit" class="btn-dialog-confirm">
        <mat-icon>save</mat-icon>
        <span>تحديث</span>
      </button>

      <button type="button" class="btn-dialog-cancel" (click)="close()">
        <span>إلغاء</span>
      </button>
    </div>
  </form>
</div>
