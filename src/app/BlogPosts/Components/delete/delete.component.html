<div class="clay-dialog clay-dialog-shell" dir="rtl">
  <!-- رأس النافذة المنبثقة (Header) -->
  <div class="clay-dialog-header">
    <div class="header-title-group">
      <div class="dialog-header-icon peach">
        <mat-icon>delete_outline</mat-icon>
      </div>
      <div>
        <h2 class="dialog-title">حذف المنشور</h2>
        <p class="dialog-subtitle">تأكيد عملية الحذف النهائي</p>
      </div>
    </div>
    <button type="button" class="btn-close" (click)="close()" aria-label="إغلاق">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- محتوى رسالة التأكيد (Body) -->
  <div class="clay-dialog-body">
    <div class="dialog-info-card">
      <mat-icon>warning_amber</mat-icon>
      <p>
        هل أنت متأكد أنك تريد حذف هذا المنشور؟ لا يمكن التراجع عن هذا الإجراء لاحقاً.
      </p>
    </div>

    <div class="field-group" style="text-align: center; margin: 1rem 0;">
      <label>عنوان المنشور المراد حذفه:</label>
      <span class="section-title" style="border: none; margin-bottom: 0; padding-bottom: 0; color: var(--cta-salmon);">
        {{ data.title || 'هذا المنشور' }}
      </span>
    </div>
  </div>

  <!-- أزرار الإجراءات (Actions) -->
  <div class="clay-dialog-actions">
    <button type="button" class="btn-dialog-confirm" (click)="confirmDelete()">
      <mat-icon>delete_forever</mat-icon>
      <span>تأكيد الحذف</span>
    </button>

    <button type="button" class="btn-dialog-cancel" (click)="close()">
      <span>إلغاء</span>
    </button>
  </div>
</div>
